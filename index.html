<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Mashrut Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* PAROL OYNASI */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f1015; z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #welcome-msg {
            font-size: 24px; font-weight: bold; color: #00d2ff;
            text-align: center; display: none; margin-bottom: 20px;
        }
        .pass-box {
            background: #1c1d25; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
        }
        .pass-input {
            width: 150px; height: 50px; background: #000; border: 1px solid #333;
            border-radius: 10px; color: #fff; text-align: center; font-size: 24px;
            letter-spacing: 5px; outline: none; margin-bottom: 15px;
        }

        /* ASOSIY SAHIFA */
        #main-content { display: none; }

        body { background: #0f1015; color: white; padding-bottom: 160px; min-height: 100vh; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 10px; }
        .header { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        #page-title { font-size: 1.2rem; color: #00d2ff; cursor: pointer; border-bottom: 1px dashed; }
        
        .calc-trigger {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white; border: 2px solid rgba(255,255,255,0.2); 
            width: 70px; height: 70px; border-radius: 20px; cursor: pointer; font-size: 32px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .calc-trigger::after { content: "CALC"; font-size: 10px; font-weight: bold; }
        
        .table-box { background: white; border-radius: 8px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #f1f1f1; padding: 10px; border: 1px solid #ddd; font-size: 11px; color: #333; text-align: center; }
        td { border: 1px solid #ddd; padding: 0; }
        input { width: 100%; border: none; padding: 12px 5px; font-size: 14px; outline: none; color: #000; text-align: center; }
        
        .fixed-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #16171d; 
            border-top: 3px solid #28a745; padding: 10px; display: flex; justify-content: space-around;
        }
        .footer-val { font-size: 20px; font-weight: bold; }
        .grand-total { font-size: 28px; color: #28a745; }
        
        #calc-popup {
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: #1c1d25;
            padding: 15px; border-radius: 25px; z-index: 2000; width: 300px;
        }
        .c-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .c-btn { height: 50px; border: none; border-radius: 12px; background: #2d2e37; color: white; cursor: pointer; }
        
        .archive-item { 
            background: rgba(255,255,255,0.05); margin-top: 10px; padding: 15px; 
            border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid #00d2ff; cursor: pointer;
        }
        .btn-tg { background: #0088cc; color: white; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; flex: 1; margin-left: 5px; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div id="welcome-msg"></div>
    <div class="pass-box" id="input-area">
        <h3 style="color: #888; margin-bottom: 10px; font-size: 14px;">PAROLNI KIRITING</h3>
        <input type="password" class="pass-input" id="pass-field" maxlength="4" oninput="checkPass()">
    </div>
</div>

<div id="main-content" class="container">
    <div class="header">
        <div class="header-top">
            <h2 id="page-title" onclick="renameRoute()">Bektemir mashrudi</h2>
            <button class="calc-trigger" onclick="toggleCalc()"><span>🖩</span></button>
        </div>
        <div style="display: flex; margin-top: 15px;">
            <button style="background:#007bff; color:white; flex: 2; padding:12px; border-radius:10px; border:none; cursor:pointer; font-weight:bold;" onclick="startNewRoute()">💾 ARXIVLASH VA YANGI OCHISH</button>
            <button class="btn-tg" onclick="sendToTelegram()">✈️ TELEGRAMGA YUBORISH</button>
        </div>
    </div>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th style="width: 200px;">Klent</th>
                    <th>Qarz</th>
                    <th>K.Qarz</th>
                    <th style="background:#f9f9f9">Nechta oldi</th>
                    <th style="background:#28a745; color:white">Naqt toladi</th>
                    <th style="background:#007bff; color:white">Karta toladi</th>
                    <th style="width: 40px;">#</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    
    <button onclick="addRow()" style="width:100%; padding:14px; margin-top:10px; background:#28a745; color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold;">+ YANGI QATOR</button>

    <div class="date-section" style="margin-top:20px; padding:10px; background:rgba(255,255,255,0.05); border-radius:10px;">
        <span style="font-size: 12px; color: #888;">Hozirgi Sana:</span>
        <input type="text" id="route-date" style="background:transparent; color:#00d2ff; border:none; border-bottom:1px solid #444; margin-left:10px; outline:none; font-weight:bold; width: 150px;" placeholder="Sana yozing..." oninput="saveDate()">
    </div>
    
    <div id="archive-list"></div>
</div>

<div class="fixed-footer" id="footer-ui" style="display:none;">
    <div style="text-align:center">
        <div style="font-size:10px; color:#888;">To'langan</div>
        <div class="footer-val" id="total-paid" style="color: #00d2ff;">0 $</div>
    </div>
    <div style="text-align:center">
        <div style="font-size:10px; color:#888;">Umumiy Qarz</div>
        <div class="footer-val grand-total" id="grand-total">0.00 $</div>
    </div>
</div>

<div id="calc-popup">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
        <span style="font-size: 12px; color: #888;">KALKULYATOR</span>
        <button onclick="toggleCalc()" style="color:#ff4757; background:none; border:none; font-size:24px;">&times;</button>
    </div>
    <input type="text" id="c-display" style="width:100%; height:50px; background:#000; color:#00d2ff; border:none; border-radius:10px; text-align:right; padding:10px; font-size:20px; margin-bottom:10px" disabled>
    <div class="c-grid">
        <button class="c-btn" onclick="cClear()">C</button>
        <button class="c-btn" onclick="cPush('/')">/</button>
        <button class="c-btn" onclick="cPush('*')">*</button>
        <button class="c-btn" onclick="cBack()">⌫</button>
        <button class="c-btn" onclick="cPush('7')">7</button>
        <button class="c-btn" onclick="cPush('8')">8</button>
        <button class="c-btn" onclick="cPush('9')">9</button>
        <button class="c-btn" onclick="cPush('-')">-</button>
        <button class="c-btn" onclick="cPush('4')">4</button>
        <button class="c-btn" onclick="cPush('5')">5</button>
        <button class="c-btn" onclick="cPush('6')">6</button>
        <button class="c-btn" onclick="cPush('+')">+</button>
        <button class="c-btn" onclick="cPush('1')">1</button>
        <button class="c-btn" onclick="cPush('2')">2</button>
        <button class="c-btn" onclick="cPush('3')">3</button>
        <button class="c-btn" onclick="cPush('.')">.</button>
        <button class="c-btn" style="grid-column: span 2;" onclick="cPush('0')">0</button>
        <button class="c-btn" style="grid-column: span 2; background:#f39c12; font-weight: bold;" onclick="cRes()">=</button>
    </div>
</div>

<script>
    function checkPass() {
        const pass = document.getElementById('pass-field').value;
        if (pass === "8383" || pass === "4444") {
            document.getElementById('input-area').style.display = "none";
            const msg = document.getElementById('welcome-msg');
            msg.style.display = "block";
            msg.innerText = (pass === "8383") ? "ASSALOMU ALAYKUM ABDULLOH AKA" : "ASSALOMU ALAYKUM JAVOXIR AKA";
            setTimeout(() => {
                document.getElementById('lock-screen').style.display = "none";
                document.getElementById('main-content').style.display = "block";
                document.getElementById('footer-ui').style.display = "flex";
                init();
            }, 2000);
        }
    }

    let rows = JSON.parse(localStorage.getItem('active_rows')) || [{name: "", c3: "", c4: "", count: "", p_cash: "", p_card: ""}];
    let archive = JSON.parse(localStorage.getItem('mashrut_archive')) || [];
    let currentTitle = localStorage.getItem('active_title') || "Bektemir mashrudi";
    let savedDate = localStorage.getItem('active_date') || "";

    function init() {
        document.getElementById('page-title').innerText = currentTitle;
        document.getElementById('route-date').value = savedDate;
        renderTable();
        renderArchive();
    }

    function renderTable() {
        const body = document.getElementById('table-body');
        body.innerHTML = '';
        rows.forEach((row, index) => {
            body.innerHTML += `
                <tr>
                    <td><input type="text" style="text-align:left; padding-left:10px; font-weight:bold" value="${row.name}" oninput="updateCell(${index}, 'name', this.value)"></td>
                    <td><input type="number" value="${row.c3}" oninput="updateCell(${index}, 'c3', this.value)"></td>
                    <td><input type="number" value="${row.c4}" oninput="updateCell(${index}, 'c4', this.value)"></td>
                    <td><input type="text" value="${row.count || ''}" oninput="updateCell(${index}, 'count', this.value)"></td>
                    <td class="col-pay-cash"><input type="number" value="${row.p_cash || ''}" oninput="updateCell(${index}, 'p_cash', this.value)"></td>
                    <td class="col-pay-card"><input type="number" value="${row.p_card || ''}" oninput="updateCell(${index}, 'p_card', this.value)"></td>
                    <td><button onclick="removeRow(${index})" style="background:none; border:none; color:red; font-size:18px;">&times;</button></td>
                </tr>`;
        });
        calculateTotal();
    }

    function updateCell(i, f, v) { rows[i][f] = v; localStorage.setItem('active_rows', JSON.stringify(rows)); calculateTotal(); }
    
    function calculateTotal() {
        let gt = 0, tp = 0;
        rows.forEach(r => { gt += (parseFloat(r.c3)||0) + (parseFloat(r.c4)||0); tp += (parseFloat(r.p_cash)||0) + (parseFloat(r.p_card)||0); });
        document.getElementById('grand-total').innerText = gt.toLocaleString() + " $";
        document.getElementById('total-paid').innerText = tp.toLocaleString() + " $";
    }

    // YANGI QATOR QO'SHISH FUNKSIYASI
    function addRow() {
        rows.push({name: "", c3: "", c4: "", count: "", p_cash: "", p_card: ""});
        localStorage.setItem('active_rows', JSON.stringify(rows));
        renderTable();
    }

    function removeRow(i) { if(confirm("O'chirish?")) { rows.splice(i,1); localStorage.setItem('active_rows', JSON.stringify(rows)); renderTable(); } }

    function startNewRoute() {
        let name = prompt("Yangi mashrut uchun nom kiriting (Eskisi arxivga tushadi):");
        if(name) {
            archive.push({ title: currentTitle, date: savedDate || "Sana yo'q", data: [...rows] });
            localStorage.setItem('mashrut_archive', JSON.stringify(archive));
            currentTitle = name; rows = [{name: "", c3: "", c4: "", count: "", p_cash: "", p_card: ""}]; savedDate = "";
            localStorage.setItem('active_title', currentTitle); localStorage.setItem('active_rows', JSON.stringify(rows)); localStorage.setItem('active_date', "");
            init();
        }
    }

    function renderArchive() {
        const list = document.getElementById('archive-list');
        list.innerHTML = '<h4 style="margin-top:20px; color:#888; border-bottom:1px solid #333; padding-bottom:5px;">Arxivlangan Sahifalar</h4>';
        archive.forEach((item, index) => {
            list.innerHTML += `
            <div class="archive-item" onclick="openArchive(${index})">
                <div><b>${item.title}</b><br><small style="color:#888">${item.date}</small></div>
                <button onclick="deleteArchive(event, ${index})" style="background:#ff4757; color:white; border:none; padding:8px 12px; border-radius:8px;">O'chirish</button>
            </div>`;
        });
    }

    function openArchive(index) {
        if(confirm("Hozirgi ishni arxivga saqlab, tanlangan eski sahifani ochaymi?")) {
            archive.push({ title: currentTitle, date: savedDate, data: [...rows] });
            const selected = archive[index];
            currentTitle = selected.title; rows = selected.data; savedDate = selected.date;
            archive.splice(index, 1);
            localStorage.setItem('active_title', currentTitle); localStorage.setItem('active_rows', JSON.stringify(rows)); localStorage.setItem('mashrut_archive', JSON.stringify(archive));
            init();
        }
    }

    function deleteArchive(e, i) { e.stopPropagation(); if(confirm("Arxiv o'chirilsinmi?")) { archive.splice(i, 1); localStorage.setItem('mashrut_archive', JSON.stringify(archive)); renderArchive(); } }
    function saveDate() { savedDate = document.getElementById('route-date').value; localStorage.setItem('active_date', savedDate); }
    function renameRoute() { let n = prompt("Sahifa nomi:", currentTitle); if(n) { currentTitle = n; localStorage.setItem('active_title', n); init(); } }
    function toggleCalc() { let p = document.getElementById('calc-popup'); p.style.display = (p.style.display==='block')?'none':'block'; }
    function cPush(v) { document.getElementById('c-display').value += v; }
    function cClear() { document.getElementById('c-display').value = ''; }
    function cBack() { let d = document.getElementById('c-display'); d.value = d.value.slice(0,-1); }
    function cRes() { let d = document.getElementById('c-display'); try { d.value = eval(d.value); } catch { d.value = 'Xato'; } }
    
    async function sendToTelegram() {
        const TG_TOKEN = ""; 
        const TG_CHAT_ID = "5588598964"; 
        let msg = `📋 *HISOBOT: ${currentTitle}*\n📅 *Sana:* ${savedDate || "Yozilmagan"}\n\n`;
        let tQ = 0, tKQ = 0, tP = 0;
        rows.forEach(r => {
            let q = parseFloat(r.c3)||0, kq = parseFloat(r.c4)||0, nc = parseFloat(r.p_cash)||0, kc = parseFloat(r.p_card)||0;
            tQ += q; tKQ += kq; tP += (nc+kc);
            if(r.name.trim() !== "") {
                msg += `👤 *Klent:* ${r.name}\n📦 *Olgan:* ${r.count||0}\n`;
                if(q>0) msg += `🔴 *Qarz:* ${q}$ `;
                if(kq>0) msg += `💳 *K.Qarz:* ${kq}$ `;
                if(nc>0) msg += `💵 *Naqt:* ${nc}$ `;
                if(kc>0) msg += `🔵 *Karta:* ${kc}$ `;
                msg += `\n----------------------------\n`;
            }
        });
        msg += `📊 *Jami Qarz:* ${(tQ+tKQ)}$\n✅ *Jami To'lov:* ${tP}$`;
        fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
        alert("Yuborildi!");
    }
</script>
</body>
</html>
